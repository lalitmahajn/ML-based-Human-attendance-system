{% extends "base.html" %}
{% block title %}Delete Employee{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card card-shadow airi-card p-4 text-center">
            <div class="mb-3 text-danger fs-1">
                <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            </div>
            <h1 class="h4 mb-2">Delete {{ object.full_name }}?</h1>
            <p class="text-muted mb-4">Are you sure you want to delete this employee? Their facial embeddings, profile records, and attendance history will be permanently removed.</p>
            <form method="post">
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url('employees:list') }}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-x me-1" aria-hidden="true"></i>Cancel
                    </a>
                    <button class="btn btn-danger px-4" type="submit">
                        <i class="bi bi-trash me-1" aria-hidden="true"></i>Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
